name: ESP32 firmware, installer & release

# Every push that touches the ESP32 version builds the firmware and checks the
# DSP core against the Python analyzer; from main it also publishes the
# browser installer to GitHub Pages. To release: Actions -> this workflow ->
# Run workflow on main with "release" ticked. That tags esp32-v<esp32/VERSION>
# and creates a GitHub Release with the firmware attached.
on:
  push:
    branches: ["**"]
    paths: ["esp32/**", "watchgrapher/dsp.py", "watchgrapher/analysis.py", "tools/synth.py",
            ".github/workflows/esp32.yml", ".github/scripts/make_site.py"]
  pull_request:
    paths: ["esp32/**", "watchgrapher/dsp.py", "watchgrapher/analysis.py", "tools/synth.py",
            ".github/workflows/esp32.yml", ".github/scripts/make_site.py"]
  workflow_dispatch:
    inputs:
      release:
        description: "Create a GitHub Release for the version in esp32/VERSION"
        type: boolean
        default: false

permissions:
  contents: read

# Actions are pinned to commit SHAs (the comment gives the tag), so a moved or
# hijacked tag can't change what runs here. Update them deliberately.

concurrency:
  group: esp32-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  # The C++ DSP core against the Python analyzer, and the USB audio parser.
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: pip install numpy scipy
      - run: cmake -S esp32/host -B build/host && cmake --build build/host
      - run: build/host/uac_test
      - run: python esp32/host/compare.py build/host/wgcli
      - run: python esp32/host/stream_check.py build/host/wgcli

  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('esp32/platformio.ini') }}

      - name: Install PlatformIO
        run: pip install "platformio==6.2.0"

      - name: Compile both board variants
        working-directory: esp32
        run: pio run -e esp32s3 -e esp32s3-n8r8

      - name: Assemble site
        run: |
          python3 .github/scripts/make_site.py _site \
            n16r8=esp32/.pio/build/esp32s3 \
            n8r8=esp32/.pio/build/esp32s3-n8r8

      - name: Attest the published firmware
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: _site/**/*.bin

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site

      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: firmware
          path: |
            _site/firmware/*.bin
            _site/n8r8/firmware/*.bin

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [build, host-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main'
    needs: [build, host-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: firmware
          path: firmware

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="$(tr -d '[:space:]' < esp32/VERSION)"
          TAG="esp32-v$V"
          find firmware -name '*.bin' | while read -r f; do
            cp "$f" "./$(basename "${f%.bin}")-$V.bin"
          done
          gh release create "$TAG" --target "$GITHUB_SHA" --title "WatchGrapher ESP32 $V" \
            --notes "Standalone ESP32-S3 firmware $V. Install from the browser at https://legal-copy7045.github.io/watchgrapher/ or flash the .factory.bin at offset 0." \
            ./*-$V.bin

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "*.bin"
