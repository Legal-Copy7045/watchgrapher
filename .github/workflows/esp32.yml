# Builds the ESP32-S3 firmware and checks its DSP core against the Python analyzer.
name: ESP32 firmware
on:
  push:
    paths: ["esp32/**", "watchgrapher/dsp.py", "watchgrapher/analysis.py", "tools/synth.py", ".github/workflows/esp32.yml"]
  pull_request:
    paths: ["esp32/**", "watchgrapher/dsp.py", "watchgrapher/analysis.py", "tools/synth.py", ".github/workflows/esp32.yml"]
permissions:
  contents: read
jobs:
  dsp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install numpy scipy
      - run: cmake -S esp32/host -B build/host && cmake --build build/host
      - run: python esp32/host/compare.py build/host/wgcli
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('esp32/platformio.ini') }}
      - run: pip install platformio
      - run: cd esp32 && pio run -e esp32s3 -e esp32s3-n8r8
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            esp32/.pio/build/esp32s3/firmware.bin
            esp32/.pio/build/esp32s3-n8r8/firmware.bin
