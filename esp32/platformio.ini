; WatchGrapher standalone firmware for the ESP32-S3.
;
;   pio run -e esp32s3 -t upload        build and flash over USB
;   pio device monitor                  serial log (115200)
;
; Needs an ESP32-S3 with 8 MB of octal PSRAM: an ESP32-S3-DevKitC-1-N16R8 or
; N8R8, or any S3 board with an N16R8 / N8R8 module. The web app is gzipped
; into the firmware at build time (tools/embed_web.py), so there is no
; separate filesystem image to upload.

[platformio]
default_envs = esp32s3

[env]
platform = espressif32@6.9.0
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
extra_scripts = pre:tools/embed_web.py
build_unflags = -Os
build_flags =
    -O2
    -DBOARD_HAS_PSRAM
    -DWG_FW_VERSION=\"0.1.0\"
    -DCORE_DEBUG_LEVEL=1
    -Wall

; 16 MB flash, 8 MB octal PSRAM (N16R8)
[env:esp32s3]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = partitions-16mb.csv

; 8 MB flash, 8 MB octal PSRAM (N8R8)
[env:esp32s3-n8r8]
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_upload.flash_size = 8MB
board_build.partitions = partitions-8mb.csv
